[package]
name = "missgram"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.13", features = ["multipart", "json"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "macros"] }
pulldown-cmark = "0.13"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
tokio-util = { version = "0.7.18", features = ["rt"] }
clap = { version = "4.6.2", features = ["derive"] }
teloxide = { version = "0.17.0", default-features = false, features = ["rustls", "macros"] }
