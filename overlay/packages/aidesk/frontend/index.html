<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AIDesk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="AIDesk — a web chat interface for the oh-my-pi (omp) coding agent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/api/manifest" crossorigin="use-credentials" />
    <title>AIDesk</title>
    <style>
      html,
      body {
        height: 100%;
        max-height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("omp-theme-mode");
          if (mode !== "auto" && mode !== "light" && mode !== "dark") mode = "auto";
          var light = localStorage.getItem("omp-theme-light");
          var dark = localStorage.getItem("omp-theme-dark");
          var lightSet = { "light": 1, "one-light": 1, "catppuccin-latte": 1, "rose-pine-dawn": 1 };
          var darkSet = { "dark": 1, "omp": 1, "dracula": 1, "harbor": 1, "one-dark-pro": 1, "rose-pine": 1, "catppuccin-mocha": 1, "gruvbox-dark": 1, "nord": 1, "tokyo-night": 1 };
          if (!lightSet[light]) light = "light";
          if (!darkSet[dark]) dark = "dark";
          var prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "auto" ? (prefersDark ? dark : light) : mode === "dark" ? dark : light;
          var isDark = !!darkSet[resolved];
          if (resolved === "omp") {
            document.documentElement.classList.add("omp");
          } else {
            document.documentElement.classList.add("theme-" + resolved);
          }
          if (isDark && resolved !== "omp") document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          var bg = { light: "#FAF9F6", "one-light": "#FAFAFA", "catppuccin-latte": "#EFF1F5", "rose-pine-dawn": "#FAF4ED", dark: "#1B1916", omp: "#000000", dracula: "#282A36", harbor: "#1B1B1B", "one-dark-pro": "#282C34", "rose-pine": "#191724", "catppuccin-mocha": "#1E1E2E", "gruvbox-dark": "#282828", nord: "#2E3440", "tokyo-night": "#1A1B26" };
          if (meta && bg[resolved]) meta.setAttribute("content", bg[resolved]);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var l = localStorage.getItem("omp-lang");
          if (l !== "en" && l !== "zh-CN" && l !== "ja") {
            var n = (navigator.language || "").toLowerCase();
            l = n.indexOf("zh") === 0 ? "zh-CN" : n.indexOf("ja") === 0 ? "ja" : "en";
          }
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var f = localStorage.getItem("omp-font-size");
          if (f === "sm" || f === "md" || f === "lg" || f === "xl") document.documentElement.setAttribute("data-font-size", f);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("omp-ui-scale");
          if (s === "compact" || s === "standard" || s === "comfortable" || s === "large") document.documentElement.setAttribute("data-ui-scale", s);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("omp-touch-targets");
          if (t === "auto" || t === "compact" || t === "accessible") document.documentElement.setAttribute("data-touch-targets", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
